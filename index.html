const STATUS={plot:["Парцел",""],ready:["Готов за живеене",""],new:["Ново строителство","new"],repair:["За ремонт","repair"]};
const FILTERS=[["all","Всички"],["apt","Апартаменти"],["house","Къщи"],["plot","Парцели"],["ready","Готови за живеене"],["new","Ново строителство"]];
let filter="all";
try{filter=localStorage.getItem("zh-filter")||"all"}catch(e){}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isHouse=p=>/къща/i.test(p.type);
const match=p=>filter==="all"||(filter==="apt"&&!isHouse(p)&&p.kind!=="plot")||(filter==="house"&&isHouse(p))||(filter==="plot"&&p.kind==="plot")||p.status===filter;
const tileClass=p=>p.kind==="house"?"t-house":p.kind==="old"?"t-old":"t-apt";
const img=(p,i)=>`images/${p.no}/${String(i).padStart(2,"0")}.jpg`;
const tileStyle=p=>p.photos?` photo" style="background-image:url('${img(p,1)}')`:"";
const title=p=>esc(p.type)+(p.other?" *":"");
const pills=p=>{const s=STATUS[p.status];return `<span class="pills"><span class="pill ${s[1]}">${s[0]}</span>${p.finish?`<span class="pill">${esc(p.finish)}</span>`:""}</span>`};
const priceHtml=(p,cls)=>p.price?`<span class="${cls}">${esc(p.price)}</span>`:`<span class="${cls} ask">Цена при запитване</span>`;
function list(){
  const items=P.filter(match);
  app.innerHTML=`<header><div class="htext"><span class="eyebrow">Варна и региона · ${P.length} имота</span><h1>Открий своя дом</h1></div><a class="brandlink" href="#" aria-label="Към началото"><img class="brand" src="brand/logo-small.png" alt="Ник Капитанов · имоти" width="96" height="55"></a><p class="lede">Подбрани имоти за собствен дом или за отдаване под наем. Докосни имот за подробности.</p></header>
  <div class="chips" role="group" aria-label="Филтър">${FILTERS.map(([k,l])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${k===filter}">${l}</button>`).join("")}</div>
  <p class="count">${items.length===P.length?"Показани всички":"Показани "+items.length+" от "+P.length}</p>
  <div class="list">${items.map(p=>{const s=STATUS[p.status];return `<button class="card" type="button" data-id="${p.id}">
    <div class="tile ${tileClass(p)}${tileStyle(p)}"><span class="no">${esc(p.short)}</span><span class="rooms">№ ${p.no}</span></div>
    <div class="cbody"><span class="ctitle">${title(p)}</span><span class="cplace">${esc(p.place)}</span><span class="cmeta">${esc(p.area)}</span>
    <div class="crow">${priceHtml(p,"price")}${pills(p)}</div></div></button>`}).join("")||'<p class="count">Няма имоти в този филтър.</p>'}</div>
  <section class="about" id="about">
    <div class="about-head"><img src="brand/nik.jpg" alt="Ник Капитанов" width="84" height="84" loading="lazy"><div><h2>Ник Капитанов</h2><div class="role">Брокер на имоти · ЕРА Вива, Варна</div></div></div>
    <p>26 години продавам неща, за които хората мислят дълго: автомобили, луксозни бизнес подаръци, а последните две години жилища. Научих, че такава покупка се решава с доверие, а то се гради с постоянство.</p>
    <p>Работя в широкия център на Варна, от Възраждане до Виница и Ален мак и надолу към морето. Основно жилища за семейства, а за строители и парцели за еднофамилни и многофамилни сгради.</p>
    <p>Работя в близък контакт със стотици брокери във Варна. Това е среда, в която оцеляват само коректните. Знам за оферти, които никога не стигат до сайтовете, а колегите споделят с мен и това, което трудно би стигнало до теб.</p>
    <p><b>Ако търсиш сериозно, мога лично да те представлявам като купувач.</b> Започваме с разговор: какво търсиш, как ще ползваш имота и как ще го финансираш. Така търся точно и не губиш време с огледи, които не са за теб. Пред теб се отваря целият пазар, не само обявите в сайтовете, и ще ти кажа и това, което го няма в тях.</p>
    <div class="cta">
      <p>Разкажи ми какво търсиш. Да се видим и при интерес ще ти дам информация и за оферти извън сайтовете.</p>
      <div class="cta-btns"><a class="btn viber" href="viber://chat?number=%2B359878760894">Пиши във Viber</a><a class="btn primary" href="tel:+359878760894">Обади се</a></div>
    </div>
    <div class="contacts">
      <a href="tel:+359878760894"><span>Телефон</span>0878 760 894</a>
      <a href="viber://chat?number=%2B359878760894"><span>Viber</span>0878 760 894</a>
      <a href="https://wa.me/359878760894" target="_blank" rel="noopener"><span>WhatsApp</span>0878 760 894</a>
      <a href="mailto:nkapitanov.era@gmail.com"><span>Имейл</span>nkapitanov.era@gmail.com</a>
      <a href="https://www.google.com/maps/search/?api=1&query=%D0%95%D0%A0%D0%90%20%D0%92%D0%B8%D0%B2%D0%B0%2C%20%D1%83%D0%BB.%20%D0%94%D0%B8%D0%BC%D0%B8%D1%82%D1%8A%D1%80%20%D0%98%D0%BA%D0%BE%D0%BD%D0%BE%D0%BC%D0%BE%D0%B2%2017%2C%20%D0%92%D0%B0%D1%80%D0%BD%D0%B0" target="_blank" rel="noopener"><span>Офис</span>ЕРА Вива, ул. Димитър Икономов 17</a>
    </div>
  </section>`;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const x=app.querySelector(".chips").scrollLeft;filter=b.dataset.f;try{localStorage.setItem("zh-filter",filter)}catch(e){}list();app.querySelector(".chips").scrollLeft=x});
  app.querySelectorAll(".card").forEach(c=>c.onclick=()=>{location.hash=c.dataset.id});
}
function detail(p){
  const s=STATUS[p.status];
  app.innerHTML=`<article class="detail"><div class="dtop"><button class="back" type="button" id="back">‹ Всички имоти</button><a class="brandlink sm" href="#" aria-label="Към началото"><img class="brand sm" src="brand/logo-small.png" alt="Ник Капитанов · имоти" width="64" height="37"></a></div>
  ${p.photos?`<div class="gwrap"><button class="garrow prev" type="button" aria-label="Предишна снимка">‹</button><button class="garrow next" type="button" aria-label="Следваща снимка">›</button><div class="gallery" aria-label="Снимки">${Array.from({length:p.photos},(_,i)=>`<img src="${img(p,i+1)}" alt="${esc(p.type)}, снимка ${i+1}" loading="${i?"lazy":"eager"}">`).join("")}</div></div><p class="gcount">${p.photos} снимки</p>`:`<div class="tile hero ${tileClass(p)}"><span class="no">${esc(p.short)}</span><span class="rooms">${esc(p.rooms)} · № ${p.no}</span></div>`}
  <div class="dhead"><span style="justify-self:start">${pills(p)}</span><h2>${title(p)}</h2><span class="cplace">${esc(p.place)}</span>
  ${priceHtml(p,"dprice")}${p.priceNote?`<span class="cmeta">${esc(p.priceNote)}</span>`:""}</div>
  ${p.note?`<div class="note"><b>Важно:</b> ${esc(p.note)}</div>`:""}
  <dl class="facts">${p.facts.map(([k,v])=>`<div class="fact"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
  <section><h3>Какво получаваш</h3><ul class="pts">${p.pts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>
  <p class="count">Още снимки и оглед: обади се или пиши във Viber.</p>
  <button class="btn share" type="button" id="share">Сподели имота</button>
  </article>`;
  document.getElementById("back").onclick=()=>{history.length>1&&location.hash?(location.hash=""):list()};
  const sh=document.getElementById("share");
  sh.onclick=async()=>{const url="https://n-kapitanov.github.io/properties/"+p.no+"/";
    if(navigator.share){try{await navigator.share({title:p.type+" · "+p.short,url});return}catch(e){if(e&&e.name==="AbortError")return}}
    try{await navigator.clipboard.writeText(url);sh.textContent="Линкът е копиран"}catch(e){prompt("Копирай линка:",url)}
    setTimeout(()=>sh.textContent="Сподели имота",2000)};
  window.scrollTo(0,0);
  const g=app.querySelector(".gallery");
  if(g){const pr=app.querySelector(".garrow.prev"),nx=app.querySelector(".garrow.next");
    const upd=()=>{pr.disabled=g.scrollLeft<10;nx.disabled=g.scrollLeft+g.clientWidth>=g.scrollWidth-10};
    pr.onclick=()=>g.scrollBy({left:-g.clientWidth,behavior:"smooth"});
    nx.onclick=()=>g.scrollBy({left:g.clientWidth,behavior:"smooth"});
    g.addEventListener("scroll",upd,{passive:true});upd();
    g.querySelectorAll("img").forEach((im,i)=>im.onclick=()=>openLB(p,i));}
}

const lb=document.getElementById("lb"),lbs=document.getElementById("lb-strip"),lbp=document.getElementById("lb-prev"),lbn=document.getElementById("lb-next");
let lbOpen=false;
function lbUpd(){const n=lbs.children.length,i=Math.round(lbs.scrollLeft/lbs.clientWidth);lbp.disabled=i<=0;lbn.disabled=i>=n-1}
function openLB(p,start){
  lbs.innerHTML=Array.from({length:p.photos},(_,i)=>`<img src="${img(p,i+1)}" alt="${esc(p.type)}, снимка ${i+1}">`).join("");
  lb.hidden=false;document.body.style.overflow="hidden";lbOpen=true;
  requestAnimationFrame(()=>{lbs.scrollLeft=start*lbs.clientWidth;lbUpd()});
  history.pushState({lb:1},"");
  const fs=lb.requestFullscreen||lb.webkitRequestFullscreen;
  if(fs){try{const r=fs.call(lb,{navigationUI:"hide"});if(r&&r.catch)r.catch(()=>{})}catch(e){}}
}
function inFS(){return document.fullscreenElement||document.webkitFullscreenElement}
function exitFS(){if(inFS()){const x=document.exitFullscreen||document.webkitExitFullscreen;try{const r=x.call(document);if(r&&r.catch)r.catch(()=>{})}catch(e){}}}
const onFS=()=>{if(!inFS()&&lbOpen)closeLB(false)};
document.addEventListener("fullscreenchange",onFS);document.addEventListener("webkitfullscreenchange",onFS);
function closeLB(fromPop){if(!lbOpen)return;lbOpen=false;exitFS();lb.hidden=true;document.body.style.overflow="";if(!fromPop)history.back()}
lbs.addEventListener("scroll",lbUpd,{passive:true});
lbp.onclick=()=>lbs.scrollBy({left:-lbs.clientWidth,behavior:"smooth"});
lbn.onclick=()=>lbs.scrollBy({left:lbs.clientWidth,behavior:"smooth"});
document.getElementById("lb-close").onclick=()=>closeLB(false);
window.addEventListener("popstate",()=>closeLB(true));
document.addEventListener("keydown",e=>{if(!lbOpen)return;if(e.key==="Escape")closeLB(false);if(e.key==="ArrowRight")lbn.click();if(e.key==="ArrowLeft")lbp.click()});
window.addEventListener("resize",()=>{if(lbOpen)lbUpd()});
function route(){const h=location.hash.slice(1),p=P.find(x=>x.id===h);if(p)detail(p);else{list();const a=h==="about"&&document.getElementById("about");a?a.scrollIntoView():window.scrollTo(0,0)}}
document.getElementById("who").onclick=()=>{if(location.hash==="#about"){const a=document.getElementById("about");a&&a.scrollIntoView({behavior:"smooth"})}else location.hash="about"};
window.addEventListener("hashchange",route);route();
</script>
